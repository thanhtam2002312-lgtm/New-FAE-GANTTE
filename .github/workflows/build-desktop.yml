name: Build Desktop Apps (Mac & Windows)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'README.md'

jobs:
  build-mac:
    name: Build Mac (.dmg)
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Mac App
        run: npm run electron:build:mac

      - name: Upload Mac DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mac-Application-DMG
          path: release/*.dmg
          if-no-files-found: warn

  build-win:
    name: Build Windows (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Windows App
        run: npm run electron:build:win

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Installer-EXE
          path: release/*.exe
          if-no-files-found: warn
