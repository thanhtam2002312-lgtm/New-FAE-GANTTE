name: Build Desktop Apps (Tauri ~9MB)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'README.md'

jobs:
  build-mac-tauri:
    name: Build Mac (.dmg) - ~9MB Tauri
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Build Tauri Mac App (.dmg)
        run: npm run tauri:build

      - name: Upload 9MB Mac DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FAE-Dashboard-Mac-Tauri-9MB-DMG
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  build-win-tauri:
    name: Build Windows (.exe) - ~5MB Tauri
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Build Tauri Windows App
        run: npm run tauri:build

      - name: Upload 5MB Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FAE-Dashboard-Windows-Tauri-5MB-EXE
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
